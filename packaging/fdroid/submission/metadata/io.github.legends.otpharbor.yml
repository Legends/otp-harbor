MaintainerNotes: |-
  REVIEW DRAFT ONLY. Do not enable until the .NET Android toolchain and the
  locked NuGet dependency provenance have passed F-Droid policy review and
  this recipe has completed a clean build/scanner run on the buildserver.
  There are deliberately no scanignore or scandelete exemptions.

  android-v3.0.3 resolves to c801e73224f3d6abed33396f858c54866b8e70f2 and
  pins SDK 10.0.402, not the development branch's 10.0.404. SDK URL/SHA-512
  are from Microsoft's public .NET 10 release metadata. An accepted source
  toolchain recipe may have to replace the proposed binary SDK bootstrap.

  Use F-Droid-managed signing. No Binaries or AllowedAPKSigningKeys fields
  are supplied: upstream-signature reproducibility is not established.
  The output selects the unsigned APK sibling, not the debug-signed sibling.
  Verify the actual Linux output path and unsigned status before activation.

  VersionCode = major*10000000 + minor*100000 + patch*100 + 99.
  Automatic updates are disabled for this draft. Default Tags detection
  cannot infer the CI-injected version from development csproj values.
  A reviewed extraction strategy is needed before enabling automation.
  Localized text and images are maintained in fastlane/metadata/android.
  Do not override the four upstream listing locales with top-level Summary
  or Description fields. Switching between F-Droid and GitHub/Play signing
  identities requires the documented encrypted-backup migration.

