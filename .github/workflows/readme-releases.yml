name: Refresh README releases

on:
  workflow_call:
    secrets:
      GH_PAT:
        description: Optional maintainer token authorized to update the protected default branch
        required: false
  workflow_dispatch:
  release:
    types: [published, edited, deleted, unpublished, released]
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: readme-release-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Test release metadata generator
        run: |
          python -m unittest discover -s scripts/validation -p test_readme_releases.py
          python -m unittest discover -s scripts/validation -p test_public_store_version.py

      - name: Refresh published release information and commit README
        id: refresh
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "README refresh push attempt $attempt of 3."
            git pull --rebase origin "$DEFAULT_BRANCH"
            python scripts/release/Sync-PublicMicrosoftStoreVersion.py --keep-current-on-error
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            python scripts/release/Update-ReadmeReleases.py --repository "$GITHUB_REPOSITORY" --releases-json "$RUNNER_TEMP/releases.json"
            python scripts/release/Update-ReadmeReleases.py --website site/index.html --releases-json "$RUNNER_TEMP/releases.json"
            if git diff --quiet -- readme.md site/index.html packaging/windows-store/public-version.json packaging/windows-store/STORE_LISTING.md; then
              exit 0
            fi
            git add -- readme.md site/index.html packaging/windows-store/public-version.json packaging/windows-store/STORE_LISTING.md
            git commit -m 'docs: refresh published release information'
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Drop only this job's unpublished generated commit before retrying against the current branch.
            git reset --soft HEAD~1
            git restore --staged --worktree -- readme.md site/index.html packaging/windows-store/public-version.json packaging/windows-store/STORE_LISTING.md
          done
          echo 'README update failed; check GH_PAT default-branch write permissions and rerun this workflow.' >&2
          exit 1

      # A push made with GITHUB_TOKEN does not trigger the Pages push workflow.
      - name: Deploy refreshed release information
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
