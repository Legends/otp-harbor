name: Build, Test and Publish OTP Harbor App

on:
  push:
    branches: [master, 'release/1.x']
    tags:
      - 'v*'
      - 'android-v*'
  pull_request:
    branches: [master, 'release/1.x']
  workflow_dispatch:
    inputs:
      candidate_validation_scope:
        description: 'Pre-merge validation candidate; never authorizes production'
        type: choice
        options: [none, all, desktop, mobile]
        default: none
      signpath_rehearsal:
        description: 'Build, submit, and verify a non-published Windows signing rehearsal'
        required: true
        default: false
        type: boolean
      rehearsal_version:
        description: 'Three-part product version used for the signing rehearsal'
        required: true
        default: '2.0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'otp-production-release' || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  managed-release-tag:
    if: startsWith(github.ref, 'refs/tags/') && vars.RELEASE_APP_BOT_LOGIN != '' && github.actor == vars.RELEASE_APP_BOT_LOGIN
    runs-on: ubuntu-24.04
    steps:
      - name: Keep the orchestrator as the single owner of this tag
        run: echo 'The dedicated release App created this tag for an already validated candidate. Production preparation and promotion remain in the original Release OTP Harbor run.'

  validate-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_validation_scope != 'none'
    permissions:
      contents: write
      actions: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      scope: ${{ inputs.candidate_validation_scope }}
      mode: validate
      store_action: prepare
    # No production secrets are forwarded. Called jobs narrow their permissions;
    # publication and attestation mutation jobs/steps are disabled in validate mode.

  legacy-release-policy:
    if: startsWith(github.ref, 'refs/tags/') && (vars.RELEASE_APP_BOT_LOGIN == '' || github.actor != vars.RELEASE_APP_BOT_LOGIN)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require strict stable identity and existing production protection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: ./scripts/release/shared/Test-LegacyReleasePolicy.ps1 -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE

  build-test:
    if: (github.event_name != 'workflow_dispatch' || inputs.candidate_validation_scope == 'none') && !(startsWith(github.ref, 'refs/tags/') && vars.RELEASE_APP_BOT_LOGIN != '' && github.actor == vars.RELEASE_APP_BOT_LOGIN)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate application and packaging policy
        uses: ./.github/actions/validate-application

  platform-validation:
    if: (github.event_name != 'workflow_dispatch' || inputs.candidate_validation_scope == 'none') && !(startsWith(github.ref, 'refs/tags/') && vars.RELEASE_APP_BOT_LOGIN != '' && github.actor == vars.RELEASE_APP_BOT_LOGIN)
    uses: ./.github/workflows/reusable-validation.yml
    with:
      include_unit: false
      validation_only: false

  signpath-windows-rehearsal:
    name: SignPath Windows rehearsal (no release)
    needs: [build-test, platform-validation]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signpath_rehearsal }}
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate rehearsal source and metadata
        id: versioning
        shell: pwsh
        env:
          SOURCE_REF: ${{ github.ref }}
          REHEARSAL_VERSION: ${{ inputs.rehearsal_version }}
        run: |
          if ("${env:SOURCE_REF}" -ne "refs/heads/master" -and
              !"${env:SOURCE_REF}".StartsWith("refs/heads/release/", [StringComparison]::Ordinal)) {
            throw "Signing rehearsals must run from master or a release/* branch."
          }
          $version = "${env:REHEARSAL_VERSION}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The rehearsal version must contain exactly three numeric components."
          }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$version.65534" >> $env:GITHUB_OUTPUT
          "assembly_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.404"
          cache: true
          cache-dependency-path: |
            OtpHarbor.UI.Avalonia.Desktop/OtpHarbor.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Restore Windows release graph
        run: >-
          dotnet restore OtpHarbor.UI.Avalonia.Desktop/OtpHarbor.UI.Avalonia.Desktop.csproj
          --runtime win-x64
          -p:PublishReadyToRun=true
          --nologo
          --verbosity minimal
          --configfile NuGet.config

      - name: Publish Windows rehearsal payloads
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
          RELEASE_FILE_VERSION: ${{ steps.versioning.outputs.file_version }}
          RELEASE_ASSEMBLY_VERSION: ${{ steps.versioning.outputs.assembly_version }}
        run: |
          $metadata = @(
            "-p:Version=${env:RELEASE_VERSION}",
            "-p:InformationalVersion=${env:RELEASE_VERSION}",
            "-p:IncludeSourceRevisionInInformationalVersion=false",
            "-p:FileVersion=${env:RELEASE_FILE_VERSION}",
            "-p:AssemblyVersion=${env:RELEASE_ASSEMBLY_VERSION}")
          dotnet publish OtpHarbor.UI.Avalonia.Desktop/OtpHarbor.UI.Avalonia.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true --no-restore `
            --nologo --verbosity minimal -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false @metadata --output release-publish
          dotnet publish OtpHarbor.UI.Avalonia.Desktop/OtpHarbor.UI.Avalonia.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained false --no-restore `
            --nologo --verbosity minimal -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false @metadata --output release-fast
          ./scripts/release/shared/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-publish
          ./scripts/release/shared/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-fast

      - name: Upload unsigned Windows rehearsal payload
        id: upload-signpath-rehearsal
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signpath-rehearsal-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-publish
            release-fast
          retention-days: 1
          if-no-files-found: error

      - name: Submit rehearsal payload to SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: totp-manager
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release-v1
          github-artifact-id: ${{ steps.upload-signpath-rehearsal.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed
          parameters: |
            version: ${{ toJSON(steps.versioning.outputs.release_version) }}

      - name: Validate signed rehearsal payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
        run: |
          ./scripts/release/windows/Apply-SignPathSignedPayload.ps1 `
            -SignedRoot signpath-signed `
            -TargetDirectory release-publish,release-fast `
            -ExpectedProductVersion "${env:RELEASE_VERSION}"

      - name: Retain signed rehearsal evidence temporarily
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signpath-rehearsal-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-publish
            release-fast
          retention-days: 1
          if-no-files-found: error

  package-avalonia-release:
    name: Prepare desktop packages
    needs: [build-test, platform-validation, legacy-release-policy]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-desktop-package.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  package-microsoft-store-msix:
    name: Package Microsoft Store MSIX
    needs: package-avalonia-release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm Store package prepared by reusable desktop workflow
        run: echo 'Store input is retained with the desktop candidate.'

  package-android-release:
    name: Prepare Android package
    needs: [build-test, platform-validation, legacy-release-policy]
    if: startsWith(github.ref, 'refs/tags/android-v')
    uses: ./.github/workflows/reusable-android-package.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}

  publish-unsigned-preview:
    name: Publish Windows and Linux preview
    needs: [package-avalonia-release, package-microsoft-store-msix]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    env:
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK for signed preview metadata
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.404"

      - name: Download retained preview artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: avalonia-release-*-${{ github.sha }}
          path: preview-assets
          merge-multiple: true

      - name: Validate unsigned preview payload
        id: versioning
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $tag = "${env:RELEASE_TAG}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+-rc\d+)$') {
            throw "Unsigned previews require an RC tag."
          }
          $releaseVersion = $Matches.version
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT

          $artifactPaths = @(Get-ChildItem preview-assets -File | Where-Object {
            $_.Name -match '^(OTP-Harbor-(windows-x64(?:-fast)?|linux-x64)-.+\.(zip|tar\.gz)|OTP-Harbor-windows-x64-setup-.+\.exe|otp-harbor_.+_amd64\.deb)$'
          } | Select-Object -ExpandProperty FullName)
          if ($artifactPaths.Count -ne 5) {
            throw "The preview must contain exactly five public Windows/Linux artifacts."
          }
          if (Get-ChildItem preview-assets -File | Where-Object { $_.Name -match '(appcast|macos|\.dmg$)' }) {
            throw "Unsigned previews cannot contain appcasts or macOS artifacts."
          }

          ./scripts/release/shared/New-ReleaseArtifactManifest.ps1 `
            -ReleaseVersion $releaseVersion `
            -SourceCommit "${env:SOURCE_COMMIT}" `
            -ArtifactPath $artifactPaths `
            -OutputPath preview-assets/release-artifacts-v2.json `
            -ReleaseProfile unsigned-platform-preview
          ./scripts/release/shared/Test-ReleaseArtifactManifest.ps1 `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -ArtifactDirectory preview-assets

          $checksumLines = foreach ($path in ($artifactPaths | Sort-Object)) {
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD "preview-assets/SHA256SUMS"),
            (($checksumLines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false))

      - name: Install pinned NetSparkle signing tool
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Generate and verify signed preview feed
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NETSPARKLE_PUBLIC_KEY) -or
              [string]::IsNullOrWhiteSpace($env:NETSPARKLE_PRIVATE_KEY)) {
            throw "Ed25519 release signing credentials are required for preview updates."
          }
          $clientSettings = Get-Content OtpHarbor.UI.Avalonia.Desktop/appsettings.json -Raw | ConvertFrom-Json
          $expectedPublicKey = $clientSettings.AutoUpdate.PublicKey
          if ($expectedPublicKey -cne $env:NETSPARKLE_PUBLIC_KEY.Trim()) {
            throw "The CI public key does not match the key embedded in the Avalonia client."
          }

          $keyDirectory = Join-Path $env:RUNNER_TEMP "netsparkle-keys"
          New-Item -ItemType Directory -Path $keyDirectory | Out-Null
          $publicKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.pub"
          $privateKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.priv"
          [IO.File]::WriteAllText($publicKeyPath, $env:NETSPARKLE_PUBLIC_KEY.Trim(), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($privateKeyPath, $env:NETSPARKLE_PRIVATE_KEY.Trim(), [Text.Encoding]::ASCII)
          & chmod 600 $privateKeyPath

          $baseUrl = "https://github.com/${env:RELEASE_REPOSITORY}/releases/download/${env:RELEASE_TAG}/"
          ./scripts/release/shared/Generate-AvaloniaAppcast.ps1 `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -ArtifactDirectory preview-assets `
            -BaseDownloadUrl $baseUrl `
            -PrivateKeyPath $privateKeyPath `
            -PublicKeyPath $publicKeyPath `
            -ExpectedPublicKey $expectedPublicKey `
            -OutputDirectory preview-feed
          ./scripts/release/shared/Test-AvaloniaAppcast.ps1 `
            -AppcastPath preview-feed/appcast-v2.xml `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -BaseDownloadUrl $baseUrl

          $feedSignature = (Get-Content preview-feed/appcast-v2.xml.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify preview-feed/appcast-v2.xml `
            --signature $feedSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Preview appcast signature verification failed." }

          $manifestSignature = (Get-Content preview-assets/release-artifacts-v2.json.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify preview-assets/release-artifacts-v2.json `
            --signature $manifestSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Preview manifest signature verification failed." }

          Copy-Item preview-feed/appcast-v2.xml preview-assets/
          Copy-Item preview-feed/appcast-v2.xml.signature preview-assets/

      - name: Build release change summary
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${env:RELEASE_TAG}"
          $previousTag = git tag --list 'v*' --sort=-version:refname |
            Where-Object { $_ -ne $currentTag -and $_ -match '^v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            throw "A previous published release is required to generate the change summary."
          }

          $releasePaths = @(
            'TOTP.Core',
            'TOTP.Infrastructure',
            'TOTP.DAL',
            'TOTP.Camera.OpenCv',
            'TOTP.UI.Avalonia.Shared',
            'TOTP.UI.Avalonia.Desktop',
            'TOTP.Platform.Windows',
            'TOTP.Platform.Linux',
            'TOTP.Platform.MacOS',
            'TOTP.Platform.Unix',
            'TOTP.Updater')
          $changes = @(git log "$previousTag..$currentTag" --no-merges --pretty=format:'- %s (`%h`)' -- $releasePaths)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -eq 0) {
            throw "Release '$currentTag' contains no user-visible change summary after '$previousTag'."
          }

          $delimiter = [Guid]::NewGuid().ToString('N')
          "summary<<$delimiter" >> $env:GITHUB_OUTPUT
          $changes >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "**Full Changelog**: https://github.com/${env:RELEASE_REPOSITORY}/compare/$previousTag...$currentTag" >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Upload unsigned preview to a draft
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: OTP Harbor ${{ steps.versioning.outputs.release_version }} — prerelease
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            ## Changes in this release

            ${{ steps.release_notes.outputs.summary }}

            ## Development preview

            This prerelease is provided for manual testing because the desktop packages do not yet have platform code-signing credentials.

            - The Windows executables are **not Authenticode-signed** and may trigger Microsoft Defender SmartScreen warnings.
            - The custom Avalonia setup EXE is unsigned. It installs for all users with administrator approval, then opens the application as the interactive user. It requires manual installer upgrades; application-owned updates are disabled inside this package.
            - Direct Windows and portable Linux builds check an Ed25519-signed preview appcast and require explicit confirmation before installation.
            - The first preview download remains outside operating-system publisher trust; verify its checksums before running it.
            - macOS is not included because Developer ID signing and notarization are unavailable.
            - Do not use this preview with a production vault; test with synthetic accounts only.

            Verify the downloaded file against `SHA256SUMS` and the source commit recorded in `release-artifacts-v2.json`.

            ## Code signing policy

            The desktop artifacts are intentionally unsigned at operating-system level. See the project [code signing policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING_POLICY.md) for the stable-release trust model.
          files: |
            preview-assets/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.zip
            preview-assets/OTP-Harbor-windows-x64-fast-${{ steps.versioning.outputs.release_version }}.zip
            preview-assets/OTP-Harbor-windows-x64-setup-${{ steps.versioning.outputs.release_version }}.exe
            preview-assets/OTP-Harbor-linux-x64-${{ steps.versioning.outputs.release_version }}.tar.gz
            preview-assets/otp-harbor_*_amd64.deb
            preview-assets/release-artifacts-v2.json
            preview-assets/release-artifacts-v2.json.signature
            preview-assets/appcast-v2.xml
            preview-assets/appcast-v2.xml.signature
            preview-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish validated unsigned preview
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseIds = @(gh api `
            "repos/${env:RELEASE_REPOSITORY}/releases?per_page=100" `
            --paginate `
            --jq ('.[] | select(.tag_name == "__RELEASE_TAG__") | .id'.Replace('__RELEASE_TAG__', $env:RELEASE_TAG)))
          if ($releaseIds.Count -ne 1) {
            throw "Could not resolve exactly one validated preview draft."
          }
          $releaseId = $releaseIds[0]
          gh api `
            --method PATCH `
            "repos/${env:RELEASE_REPOSITORY}/releases/$releaseId" `
            -F draft=false `
            -F prerelease=true `
            -f make_latest=false | Out-Null

      - name: Refresh the public RC appcast endpoint
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${env:RELEASE_REPOSITORY}"

  publish-avalonia-release:
    environment: release-production
    name: Publish OTP Harbor stable release
    needs: [package-avalonia-release, package-microsoft-store-msix]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    env:
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.404"

      - name: Download retained Linux release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: avalonia-release-linux-x64-${{ github.sha }}
          path: release-assets

      - name: Compute and validate aggregate artifact manifest
        id: versioning
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $tag = "${env:RELEASE_TAG}"
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:-rc(?<rc>\d+))?$') {
            throw "Release tag has an unsupported format."
          }
          $baseVersion = $Matches.base
          $rcNumber = $Matches.rc
          $releaseVersion = if ($rcNumber) { "$baseVersion-rc$rcNumber" } else { $baseVersion }
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($rcNumber) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

          $artifactPaths = @(Get-ChildItem release-assets -File | Where-Object {
            $_.Name -match '^(OTP-Harbor-linux-x64-.+\.tar\.gz|otp-harbor_.+_amd64\.deb)$'
          } | Select-Object -ExpandProperty FullName)
          if ($artifactPaths.Count -ne 2) {
            throw "The stable desktop GitHub release must contain exactly the two Linux artifacts."
          }

          ./scripts/release/shared/New-ReleaseArtifactManifest.ps1 `
            -ReleaseVersion $releaseVersion `
            -SourceCommit "${env:SOURCE_COMMIT}" `
            -ArtifactPath $artifactPaths `
            -OutputPath release-assets/release-artifacts-v2.json
          ./scripts/release/shared/Test-ReleaseArtifactManifest.ps1 `
            -ManifestPath release-assets/release-artifacts-v2.json `
            -ArtifactDirectory release-assets

      - name: Determine whether this stable tag should be latest
        id: latest_release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $currentTag = "${env:RELEASE_TAG}"
          if ($currentTag -match '-rc\d+$') {
            "make_latest=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release candidates are never marked latest."
            exit 0
          }
          if ($currentTag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
            throw "Stable release tag '$currentTag' has an unsupported format."
          }

          $stableTags = foreach ($line in (git ls-remote --tags --refs origin "v*")) {
            $parts = $line -split '\s+'
            if ($parts.Count -ge 2 -and $parts[1] -match '^refs/tags/(?<tag>v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$') {
              [PSCustomObject]@{
                Tag = $Matches.tag
                Major = [int]$Matches.major
                Minor = [int]$Matches.minor
                Patch = [int]$Matches.patch
              }
            }
          }
          $highestStableTag = $stableTags |
            Sort-Object Major, Minor, Patch |
            Select-Object -Last 1 -ExpandProperty Tag
          if ([string]::IsNullOrWhiteSpace($highestStableTag)) {
            throw "Could not determine the highest stable release tag."
          }
          $makeLatest = if ($currentTag -eq $highestStableTag) { 'true' } else { 'false' }
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT
          Write-Host "Mark stable release as latest: $makeLatest"

      - name: Install pinned NetSparkle signing tool
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Generate and verify signed Avalonia feed
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: ./scripts/release/shared/Prepare-DesktopReleaseMetadata.ps1 -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE

      - name: Build release change summary
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${env:RELEASE_TAG}"
          $previousTag = gh release list `
          --repo "${env:RELEASE_REPOSITORY}" `
          --limit 100 `
          --exclude-drafts `
          --json tagName,publishedAt `
          --jq ".[] | select(.tagName != `"$currentTag`") | [.publishedAt, .tagName] | @tsv" |
          Where-Object { ($_ -split "`t", 2)[1] -match '^v\d+\.\d+\.\d+$' } |
          Sort-Object -Descending |
          Select-Object -First 1 |
          ForEach-Object { ($_ -split "`t", 2)[1] }
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            throw "A previous published release is required to generate the change summary."
          }

          $changes = @(git log "$previousTag..$currentTag" --no-merges --pretty=format:'- %s (`%h`)')
          if ($LASTEXITCODE -ne 0 -or $changes.Count -eq 0) {
            throw "Release '$currentTag' contains no user-visible change summary after '$previousTag'."
          }

          $delimiter = [Guid]::NewGuid().ToString('N')
          "summary<<$delimiter" >> $env:GITHUB_OUTPUT
          $changes >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "**Full Changelog**: https://github.com/${env:RELEASE_REPOSITORY}/compare/$previousTag...$currentTag" >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Reject conflicting legacy publication without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: ./scripts/release/shared/Test-LegacyReleasePolicy.ps1 -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE -Publication

      - name: Upload stable GitHub release to a draft
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: OTP Harbor ${{ steps.versioning.outputs.release_version }}
          draft: true
          prerelease: ${{ steps.versioning.outputs.prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            ## Changes in this release

            ${{ steps.release_notes.outputs.summary }}

            ## Code signing policy

            Windows is distributed through the [Microsoft Store](https://apps.microsoft.com/detail/9P31KH5L924P), which signs accepted MSIX packages and manages updates. No unsigned Windows executable is attached to this stable GitHub release. SignPath remains deferred until the project has sufficient independent adoption signals.

            GitHub provides the Linux packages, release integrity metadata, and the source archives generated by GitHub. Android uses independent `android-vX.Y.Z` releases so mobile changes do not force a desktop release. See the project [code signing policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING_POLICY.md) and [privacy policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/PRIVACY.md).
          files: |
            release-assets/OTP-Harbor-linux-x64-${{ steps.versioning.outputs.release_version }}.tar.gz
            release-assets/otp-harbor_*_amd64.deb
            release-assets/release-artifacts-v2.json
            release-assets/release-artifacts-v2.json.signature
            release-assets/appcast-v2.xml
            release-assets/appcast-v2.xml.signature
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish validated draft release
        shell: pwsh
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ steps.versioning.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ steps.latest_release.outputs.make_latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/shared/verify_legacy_assets.py --tag $env:RELEASE_TAG --source $env:RELEASE_SOURCE --directory release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Final legacy release asset verification failed.' }
          $releaseIds = @(gh api `
            "repos/${env:RELEASE_REPOSITORY}/releases?per_page=100" `
            --paginate `
            --jq ('.[] | select(.tag_name == "__RELEASE_TAG__") | .id'.Replace('__RELEASE_TAG__', $env:RELEASE_TAG)))
          if ($releaseIds.Count -ne 1) {
            throw "Could not resolve exactly one validated draft release."
          }
          $releaseId = $releaseIds[0]
          gh api `
            --method PATCH `
            "repos/${env:RELEASE_REPOSITORY}/releases/$releaseId" `
            -F draft=false `
            -F prerelease=${env:RELEASE_PRERELEASE} `
            -f make_latest=${env:RELEASE_MAKE_LATEST} | Out-Null

  refresh-release-readme:
    name: Refresh README after publishing a release
    needs: [publish-avalonia-release, publish-android-release]
    if: always() && (needs.publish-avalonia-release.result == 'success' || needs.publish-android-release.result == 'success')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/readme-releases.yml
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  publish-android-release:
    environment: release-production
    name: Publish OTP Harbor Android release
    needs: [package-android-release]
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download signed Android release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: android-release-${{ github.sha }}
          path: android-release-assets

      - name: Validate Android release assets
        id: versioning
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: ./scripts/release/shared/Prepare-AndroidReleaseMetadata.ps1 -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE

      - name: Build Android change summary
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $currentTag = "${env:RELEASE_TAG}"
          $previousTag = git tag --list 'android-v*' --sort=-version:refname |
            Where-Object { $_ -ne $currentTag -and $_ -match '^android-v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $previousTag = git tag --list 'v*' --sort=-version:refname |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Select-Object -First 1
          }

          $changes = if ([string]::IsNullOrWhiteSpace($previousTag)) {
            @('- First independent Android release.')
          }
          else {
            $releasePaths = @(
              'OtpHarbor.Core',
              'OtpHarbor.Infrastructure',
              'OtpHarbor.DAL',
              'OtpHarbor.UI.Avalonia.Shared',
              'OtpHarbor.UI.Avalonia.Mobile',
              'OtpHarbor.UI.Avalonia.Android',
              'OtpHarbor.Platform.Android')
            @(git log "$previousTag..$currentTag" --no-merges --pretty=format:'- %s (`%h`)' -- $releasePaths)
          }
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to generate Android release changelog."
          }

          if ($changes.Count -eq 0) {
              $changes = @(
                  '- Maintenance release with no Android-specific code changes.'
              )
          }

          $delimiter = [Guid]::NewGuid().ToString('N')
          "summary<<$delimiter" >> $env:GITHUB_OUTPUT
          $changes >> $env:GITHUB_OUTPUT
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            "" >> $env:GITHUB_OUTPUT
            "**Full Changelog**: https://github.com/${env:RELEASE_REPOSITORY}/compare/$previousTag...$currentTag" >> $env:GITHUB_OUTPUT
          }
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Reject conflicting legacy publication without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: ./scripts/release/shared/Test-LegacyReleasePolicy.ps1 -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE -Publication

      - name: Upload Android GitHub release to a draft
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: OTP Harbor Android ${{ steps.versioning.outputs.release_version }}
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            ## Changes in this Android release

            ${{ steps.release_notes.outputs.summary }}

            ## Android package

            This universal APK is signed with OTP Harbor's pinned production Android app-signing certificate and supports in-place upgrades on Android 9 and newer. Android releases are versioned independently from the desktop applications because the user interfaces ship on different schedules while continuing to share validated Core and Infrastructure code.

            Verify the APK certificate and compare downloaded files with `SHA256SUMS`. See the project [Android release guide](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/release/ANDROID.md), [code signing policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING_POLICY.md), and [privacy policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/PRIVACY.md).
          files: |
            android-release-assets/OTP-Harbor-android-universal-${{ steps.versioning.outputs.release_version }}.apk
            android-release-assets/android-release.json
            android-release-assets/release-artifacts-v2.json
            android-release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish validated Android release
        shell: pwsh
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release/shared/verify_legacy_assets.py --tag $env:RELEASE_TAG --source $env:RELEASE_SOURCE --directory android-release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Final legacy release asset verification failed.' }
          $releaseIds = @(gh api `
            "repos/${env:RELEASE_REPOSITORY}/releases?per_page=100" `
            --paginate `
            --jq ('.[] | select(.tag_name == "__RELEASE_TAG__") | .id'.Replace('__RELEASE_TAG__', $env:RELEASE_TAG)))
          if ($releaseIds.Count -ne 1) {
            throw "Could not resolve exactly one validated Android draft release."
          }
          gh api `
            --method PATCH `
            "repos/${env:RELEASE_REPOSITORY}/releases/$($releaseIds[0])" `
            -F draft=false `
            -F prerelease=false `
            -f make_latest=false | Out-Null
