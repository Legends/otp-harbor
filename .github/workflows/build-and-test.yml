name: Build, Test and Publish OTP Harbor App

on:
  push:
    branches: [master, 'release/1.x']
    tags:
      - 'v*'  # This triggers release publishing only when a tag is pushed
  pull_request:
    branches: [master, 'release/1.x']
  workflow_dispatch:
    inputs:
      signpath_rehearsal:
        description: 'Build, submit, and verify a non-published Windows signing rehearsal'
        required: true
        default: false
        type: boolean
      rehearsal_version:
        description: 'Three-part product version used for the signing rehearsal'
        required: true
        default: '2.0.0'
        type: string

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            NuGet.config

      - name: Restore with NuGet.config
        run: dotnet restore TOTP.sln --nologo --verbosity minimal --configfile NuGet.config --source https://api.nuget.org/v3/index.json

      - name: Build solution
        run: dotnet build TOTP.sln --configuration Release --no-restore --nologo --verbosity minimal

      - name: Validate package update and preview signing policies
        shell: pwsh
        run: ./scripts/validation/Test-UnsignedPreviewReleasePolicy.ps1

      - name: Validate code-signing status disclosure
        shell: pwsh
        run: ./scripts/validation/Test-SignPathFoundationReadiness.ps1

      - name: Validate Microsoft Store packaging controls
        shell: pwsh
        run: ./scripts/validation/Test-MicrosoftStorePackaging.ps1

      - name: Validate public website
        shell: pwsh
        run: ./scripts/validation/Test-PublicWebsite.ps1

      - name: Validate source launcher safeguards
        shell: pwsh
        run: ./scripts/validation/Test-SourceLauncher.ps1

      - name: Validate Windows MSI packaging controls
        shell: pwsh
        run: ./scripts/validation/Test-WindowsMsiPackaging.ps1

      - name: Validate localization resources
        shell: pwsh
        run: ./scripts/validation/Test-LocalizationResources.ps1

      - name: Audit NuGet dependency graph
        shell: pwsh
        run: |
          ./scripts/validation/Test-NuGetVulnerabilities.ps1 `
            -SolutionPath TOTP.sln `
            -OutputPath TestResults/nuget-vulnerability-audit.json

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: nuget-vulnerability-audit-${{ github.sha }}
          path: TestResults/nuget-vulnerability-audit.json
          retention-days: 30
          if-no-files-found: error

      - name: Run fast tests (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          dotnet test TOTP.sln --configuration Release --no-build --nologo --verbosity minimal `
            --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~IdleMonitoringBackgroundServiceTests&FullyQualifiedName!~UserActivityServiceTests"

      - name: Run full tests (push/tags)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet test TOTP.sln --configuration Release --no-build --nologo --verbosity minimal `
            --logger "console;verbosity=minimal" `
            --results-directory TestResults `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none

      - name: Upload test diagnostics
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: TestResults
          if-no-files-found: ignore

  unix-file-security:
    name: Unix file security (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.Core/TOTP.Core.csproj
            TOTP.Platform.Linux/TOTP.Platform.Linux.csproj
            TOTP.Platform.MacOS/TOTP.Platform.MacOS.csproj
            TOTP.Platform.Unix/TOTP.Platform.Unix.csproj
            TOTP.Tests.Unix/TOTP.Tests.Unix.csproj
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            TOTP.UI.Avalonia.Shared/TOTP.UI.Avalonia.Shared.csproj
            NuGet.config

      - name: Restore Unix security tests
        run: dotnet restore TOTP.Tests.Unix/TOTP.Tests.Unix.csproj --nologo --verbosity minimal --configfile NuGet.config

      - name: Run Unix security tests
        run: dotnet test TOTP.Tests.Unix/TOTP.Tests.Unix.csproj --configuration Release --no-restore --nologo --verbosity minimal

      - name: Restore Avalonia desktop host
        run: dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj --nologo --verbosity minimal --configfile NuGet.config

      - name: Build Avalonia desktop host
        run: dotnet build TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj --configuration Release --no-restore --nologo --verbosity minimal

  avalonia-ui-smoke:
    name: Avalonia UI smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
          - name: macOS ARM64
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.Tests.Avalonia.Headless/TOTP.Tests.Avalonia.Headless.csproj
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Restore Avalonia headless smoke tests
        run: dotnet restore TOTP.Tests.Avalonia.Headless/TOTP.Tests.Avalonia.Headless.csproj --nologo --verbosity minimal --configfile NuGet.config

      - name: Load real application XAML under the headless platform
        run: dotnet test TOTP.Tests.Avalonia.Headless/TOTP.Tests.Avalonia.Headless.csproj --configuration Release --no-restore --nologo --verbosity minimal

  m3-package-probe:
    name: M3 package probe (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            rid: win-x64
            executable: TOTP.UI.Avalonia.Desktop.exe
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            rid: linux-x64
            executable: TOTP.UI.Avalonia.Desktop
          - name: macOS ARM64
            runner: macos-15
            rid: osx-arm64
            executable: OTP Harbor.app/Contents/MacOS/TOTP.UI.Avalonia.Desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.Camera.OpenCv/TOTP.Camera.OpenCv.csproj
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Restore target package graph
        run: >-
          dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --runtime ${{ matrix.rid }}
          --nologo
          --verbosity minimal
          --configfile NuGet.config

      - name: Publish framework-dependent M3 package
        run: >-
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --no-restore
          --nologo
          --verbosity minimal
          --output m3-publish

      - name: Assemble target-shaped M3 package
        shell: pwsh
        run: |
          ./scripts/validation/Package-M3Target.ps1 `
            -PublishDirectory m3-publish `
            -RuntimeIdentifier "${{ matrix.rid }}" `
            -OutputDirectory m3-package

          if ($IsMacOS) {
            plutil -lint "m3-package/OTP Harbor.app/Contents/Info.plist"
          }

      - name: Execute packaged native-runtime probe
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "m3-package/${{ matrix.executable }}"
          if ($IsWindows) {
            $process = Start-Process -FilePath $executable -ArgumentList "--m3-native-probe" -Wait -PassThru -WindowStyle Hidden
            $probeExitCode = $process.ExitCode
          }
          else {
            & $executable --m3-native-probe
            $probeExitCode = $LASTEXITCODE
          }
          if ($probeExitCode -ne 0) {
            throw "Packaged OpenCV native-runtime probe failed with exit code $probeExitCode."
          }

          $packageBytes = (Get-ChildItem m3-package -File -Recurse | Measure-Object Length -Sum).Sum
          "M3_PACKAGE_BYTES=$packageBytes" >> $env:GITHUB_ENV
          "### ${{ matrix.name }}`n`nPackage bytes: $packageBytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Validate native dependency closure
        shell: pwsh
        run: |
          ./scripts/validation/Test-NativePackageDependencies.ps1 `
            -PackageDirectory m3-package `
            -RuntimeIdentifier "${{ matrix.rid }}"

      - name: Assemble Windows distribution archive
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path m7-release | Out-Null
          Compress-Archive `
            -Path m3-package/* `
            -DestinationPath m7-release/OTP-Harbor-windows-x64-2.0.0.zip

      - name: Validate Linux distribution packages
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: pwsh
        run: |
          ./scripts/release/Package-AvaloniaLinux.ps1 `
            -PublishDirectory m3-publish `
            -OutputDirectory m6-linux-distribution `
            -ReleaseVersion "2.0.0" `
            -FrameworkDependent

          tar -tzf m6-linux-distribution/OTP-Harbor-linux-x64-2.0.0.tar.gz > /dev/null
          dpkg-deb --info m6-linux-distribution/otp-harbor_2.0.0_amd64.deb

      - name: Validate unsigned macOS DMG structure
        if: ${{ matrix.rid == 'osx-arm64' }}
        shell: pwsh
        run: |
          ./scripts/release/Package-AvaloniaMacOS.ps1 `
            -PublishDirectory m3-publish `
            -OutputDirectory m6-macos-distribution `
            -ReleaseVersion "2.0.0"

          plutil -lint "m6-macos-distribution/OTP Harbor.app/Contents/Info.plist"
          hdiutil verify m6-macos-distribution/OTP-Harbor-macos-arm64-2.0.0.dmg

      - name: Generate and verify target artifact manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path m7-release -Force | Out-Null
          $artifactPaths = switch ("${{ matrix.rid }}") {
            "win-x64" {
              "m7-release/OTP-Harbor-windows-x64-2.0.0.zip"
            }
            "linux-x64" {
              Copy-Item m6-linux-distribution/OTP-Harbor-linux-x64-2.0.0.tar.gz m7-release/
              Copy-Item m6-linux-distribution/otp-harbor_2.0.0_amd64.deb m7-release/
              "m7-release/OTP-Harbor-linux-x64-2.0.0.tar.gz"
              "m7-release/otp-harbor_2.0.0_amd64.deb"
            }
            "osx-arm64" {
              Copy-Item m6-macos-distribution/OTP-Harbor-macos-arm64-2.0.0.dmg m7-release/
              "m7-release/OTP-Harbor-macos-arm64-2.0.0.dmg"
            }
            default { throw "Unsupported release target." }
          }

          $manifestPath = "m7-release/release-artifacts-${{ matrix.rid }}.json"
          ./scripts/release/New-ReleaseArtifactManifest.ps1 `
            -ReleaseVersion "2.0.0" `
            -SourceCommit "${{ github.sha }}" `
            -ArtifactPath $artifactPaths `
            -OutputPath $manifestPath
          ./scripts/release/Test-ReleaseArtifactManifest.ps1 `
            -ManifestPath $manifestPath `
            -ArtifactDirectory m7-release

      - name: Upload target artifact manifest
        uses: actions/upload-artifact@v6
        with:
          name: m7-artifact-manifest-${{ matrix.rid }}-${{ github.sha }}
          path: m7-release/release-artifacts-${{ matrix.rid }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload target release package evidence
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: m7-release-${{ matrix.rid }}-${{ github.sha }}
          path: |
            m7-release/*
            !m7-release/release-artifacts-${{ matrix.rid }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Record automated M3 measurements
        shell: pwsh
        run: |
          ./scripts/validation/Measure-M3Target.ps1 `
            -PackageDirectory m3-package `
            -ExecutableName "${{ matrix.executable }}" `
            -OutputPath "m3-measurement-${{ matrix.rid }}.json" `
            -Iterations 5

          ./scripts/validation/Test-M3MeasurementBudget.ps1 `
            -ReportPath "m3-measurement-${{ matrix.rid }}.json"

          $measurement = Get-Content "m3-measurement-${{ matrix.rid }}.json" -Raw | ConvertFrom-Json
          "First probe ms: $($measurement.ProcessStartup.FirstMilliseconds)" >> $env:GITHUB_STEP_SUMMARY
          "Warm startup p95 ms: $($measurement.ProcessStartup.WarmP95Milliseconds)" >> $env:GITHUB_STEP_SUMMARY
          "Working set p95 bytes: $($measurement.WorkingSet.P95Bytes)" >> $env:GITHUB_STEP_SUMMARY
          "Native bytes: $($measurement.Package.NativeBytes)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload M3 measurement evidence
        uses: actions/upload-artifact@v6
        with:
          name: m3-measurement-${{ matrix.rid }}-${{ github.sha }}
          path: m3-measurement-${{ matrix.rid }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload M3 validation package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: m3-${{ matrix.rid }}-${{ github.sha }}
          path: m3-package
          retention-days: 7
          if-no-files-found: error

  signpath-windows-rehearsal:
    name: SignPath Windows rehearsal (no release)
    needs: [build-test, unix-file-security, avalonia-ui-smoke, m3-package-probe]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signpath_rehearsal }}
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate rehearsal source and metadata
        id: versioning
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/master" -and
              !"${{ github.ref }}".StartsWith("refs/heads/release/", [StringComparison]::Ordinal)) {
            throw "Signing rehearsals must run from master or a release/* branch."
          }
          $version = "${{ inputs.rehearsal_version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The rehearsal version must contain exactly three numeric components."
          }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$version.65534" >> $env:GITHUB_OUTPUT
          "assembly_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Restore Windows release graph
        run: >-
          dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --runtime win-x64
          -p:PublishReadyToRun=true
          --nologo
          --verbosity minimal
          --configfile NuGet.config

      - name: Publish Windows rehearsal payloads
        shell: pwsh
        run: |
          $metadata = @(
            "-p:Version=${{ steps.versioning.outputs.release_version }}",
            "-p:InformationalVersion=${{ steps.versioning.outputs.release_version }}",
            "-p:IncludeSourceRevisionInInformationalVersion=false",
            "-p:FileVersion=${{ steps.versioning.outputs.file_version }}",
            "-p:AssemblyVersion=${{ steps.versioning.outputs.assembly_version }}")
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true --no-restore `
            --nologo --verbosity minimal -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false @metadata --output release-publish
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained false --no-restore `
            --nologo --verbosity minimal -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false @metadata --output release-fast
          ./scripts/release/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-publish
          ./scripts/release/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-fast

      - name: Upload unsigned Windows rehearsal payload
        id: upload-signpath-rehearsal
        uses: actions/upload-artifact@v6
        with:
          name: signpath-rehearsal-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-publish
            release-fast
          retention-days: 1
          if-no-files-found: error

      - name: Submit rehearsal payload to SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: totp-manager
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release-v1
          github-artifact-id: ${{ steps.upload-signpath-rehearsal.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed
          parameters: |
            version: ${{ toJSON(steps.versioning.outputs.release_version) }}

      - name: Validate signed rehearsal payload
        shell: pwsh
        run: |
          ./scripts/release/Apply-SignPathSignedPayload.ps1 `
            -SignedRoot signpath-signed `
            -TargetDirectory release-publish,release-fast `
            -ExpectedProductVersion "${{ steps.versioning.outputs.release_version }}"

      - name: Retain signed rehearsal evidence temporarily
        uses: actions/upload-artifact@v6
        with:
          name: signpath-rehearsal-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-publish
            release-fast
          retention-days: 1
          if-no-files-found: error

  package-avalonia-release:
    name: Package Avalonia release (${{ matrix.rid }})
    needs: [build-test, unix-file-security, avalonia-ui-smoke, m3-package-probe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.rid == 'win-x64' && 'windows-2025' || matrix.rid == 'linux-x64' && 'ubuntu-24.04' || 'macos-15' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        rid: ${{ fromJSON(contains(github.ref_name, '-rc') && '["win-x64","linux-x64"]' || '["win-x64","linux-x64","osx-arm64"]') }}

    env:
      MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
            NuGet.config

      - name: Compute release metadata
        id: versioning
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:-rc(?<rc>\d+))?$') {
            throw "Release tag has an unsupported format."
          }
          $baseVersion = $Matches.base
          $rcNumber = $Matches.rc
          if ($rcNumber -and [int]$rcNumber -gt 65534) {
            throw "Release candidate number must be between 1 and 65534."
          }
          $releaseVersion = if ($rcNumber) { "$baseVersion-rc$rcNumber" } else { $baseVersion }
          $fileVersion = if ($rcNumber) { "$baseVersion.$rcNumber" } else { "$baseVersion.65535" }
          $assemblyVersion = if ($rcNumber) { "$baseVersion.$rcNumber" } else { "$baseVersion.0" }
          $channel = if ($rcNumber) { "rc" } else { "stable" }
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Restore target release graph
        run: >-
          dotnet restore TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --runtime ${{ matrix.rid }}
          -p:PublishReadyToRun=${{ matrix.rid == 'win-x64' }}
          --nologo
          --verbosity minimal
          --configfile NuGet.config

      - name: Publish self-contained Avalonia host
        run: >-
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --nologo
          --verbosity minimal
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=${{ matrix.rid == 'win-x64' }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.versioning.outputs.release_version }}
          -p:InformationalVersion=${{ steps.versioning.outputs.release_version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:FileVersion=${{ steps.versioning.outputs.file_version }}
          -p:AssemblyVersion=${{ steps.versioning.outputs.assembly_version }}
          --output release-publish

      - name: Publish fast framework-dependent Windows host
        if: ${{ matrix.rid == 'win-x64' }}
        run: >-
          dotnet publish TOTP.UI.Avalonia.Desktop/TOTP.UI.Avalonia.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --nologo
          --verbosity minimal
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.versioning.outputs.release_version }}
          -p:InformationalVersion=${{ steps.versioning.outputs.release_version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:FileVersion=${{ steps.versioning.outputs.file_version }}
          -p:AssemblyVersion=${{ steps.versioning.outputs.assembly_version }}
          --output release-fast

      - name: Prepare bounded release payload
        shell: pwsh
        run: |
          ./scripts/release/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-publish
          if (Test-Path -LiteralPath release-fast) {
            ./scripts/release/Prepare-AvaloniaReleasePayload.ps1 -PublishDirectory release-fast
          }

      - name: Install pinned WiX Toolset
        if: ${{ matrix.rid == 'win-x64' && contains(github.ref_name, '-rc') }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Upload unsigned Windows payload for SignPath
        id: upload-signpath-artifact
        if: ${{ matrix.rid == 'win-x64' && !contains(github.ref_name, '-rc') }}
        uses: actions/upload-artifact@v6
        with:
          name: signpath-unsigned-windows-${{ github.sha }}
          path: |
            release-publish
            release-fast
          retention-days: 1
          if-no-files-found: error

      - name: Submit Windows payload to SignPath
        if: ${{ matrix.rid == 'win-x64' && !contains(github.ref_name, '-rc') }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: totp-manager
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release-v1
          github-artifact-id: ${{ steps.upload-signpath-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed
          parameters: |
            version: ${{ toJSON(steps.versioning.outputs.release_version) }}

      - name: Validate and apply SignPath result
        if: ${{ matrix.rid == 'win-x64' && !contains(github.ref_name, '-rc') }}
        shell: pwsh
        run: |
          ./scripts/release/Apply-SignPathSignedPayload.ps1 `
            -SignedRoot signpath-signed `
            -TargetDirectory release-publish,release-fast `
            -ExpectedProductVersion "${{ steps.versioning.outputs.release_version }}"

      - name: Import macOS Developer ID certificate
        if: ${{ matrix.rid == 'osx-arm64' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $required = @(
            $env:MACOS_SIGNING_CERTIFICATE_BASE64,
            $env:MACOS_SIGNING_CERTIFICATE_PASSWORD,
            $env:MACOS_SIGNING_IDENTITY,
            $env:MACOS_NOTARY_KEY_BASE64,
            $env:MACOS_NOTARY_KEY_ID,
            $env:MACOS_NOTARY_ISSUER_ID)
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            throw "macOS Developer ID and notarization credentials are required."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "developer-id.p12"
          $certificateBytes = [Convert]::FromBase64String($env:MACOS_SIGNING_CERTIFICATE_BASE64)
          try {
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          }
          finally {
            [Security.Cryptography.CryptographicOperations]::ZeroMemory($certificateBytes)
          }
          & chmod 600 $certificatePath
          $keychainPath = Join-Path $env:RUNNER_TEMP "totp-release.keychain-db"
          $keychainPassword = [Guid]::NewGuid().ToString("N")
          & security create-keychain -p $keychainPassword $keychainPath
          & security set-keychain-settings -lut 21600 $keychainPath
          & security unlock-keychain -p $keychainPassword $keychainPath
          & security import $certificatePath -k $keychainPath -P $env:MACOS_SIGNING_CERTIFICATE_PASSWORD -T /usr/bin/codesign -T /usr/bin/security
          & security set-key-partition-list -S "apple-tool:,apple:" -s -k $keychainPassword $keychainPath
          & security list-keychains -d user -s $keychainPath
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the macOS signing Keychain." }

          $notaryKeyPath = Join-Path $env:RUNNER_TEMP "AuthKey.p8"
          $notaryKeyBytes = [Convert]::FromBase64String($env:MACOS_NOTARY_KEY_BASE64)
          try {
            [IO.File]::WriteAllBytes($notaryKeyPath, $notaryKeyBytes)
          }
          finally {
            [Security.Cryptography.CryptographicOperations]::ZeroMemory($notaryKeyBytes)
          }
          & chmod 600 $notaryKeyPath
          "MACOS_NOTARY_KEY_PATH=$notaryKeyPath" >> $env:GITHUB_ENV

      - name: Assemble release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          switch ("${{ matrix.rid }}") {
            "win-x64" {
              $appcastUrl = if ("${{ steps.versioning.outputs.channel }}" -eq "rc") {
                "https://legends.github.io/otp-harbor/updates/rc/appcast-v2.xml"
              }
              else {
                "https://github.com/Legends/otp-harbor/releases/latest/download/appcast-v2.xml"
              }
              ./scripts/release/Set-PackageUpdatePolicy.ps1 `
                -PackageDirectory release-publish `
                -DistributionMode direct `
                -Channel "${{ steps.versioning.outputs.channel }}" `
                -AppcastUrl $appcastUrl
              ./scripts/release/Set-PackageUpdatePolicy.ps1 `
                -PackageDirectory release-fast `
                -DistributionMode direct `
                -Channel "${{ steps.versioning.outputs.channel }}" `
                -AppcastUrl $appcastUrl
              Compress-Archive `
                -Path release-publish/* `
                -DestinationPath "release-assets/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.zip"
              Compress-Archive `
                -Path release-fast/* `
                -DestinationPath "release-assets/OTP-Harbor-windows-x64-fast-${{ steps.versioning.outputs.release_version }}.zip"
              if ("${{ steps.versioning.outputs.channel }}" -eq "rc") {
                $productVersion = "${{ steps.versioning.outputs.release_version }}".Split('-')[0]
                ./scripts/release/New-WindowsMsi.ps1 `
                  -PublishDirectory release-publish `
                  -OutputDirectory release-assets `
                  -ReleaseVersion "${{ steps.versioning.outputs.release_version }}" `
                  -ProductVersion $productVersion
              }
            }
            "linux-x64" {
              $appcastUrl = if ("${{ steps.versioning.outputs.channel }}" -eq "rc") {
                "https://legends.github.io/otp-harbor/updates/rc/appcast-v2.xml"
              }
              else {
                "https://github.com/Legends/otp-harbor/releases/latest/download/appcast-v2.xml"
              }
              ./scripts/release/Package-AvaloniaLinux.ps1 `
                -PublishDirectory release-publish `
                -OutputDirectory linux-distribution `
                -ReleaseVersion "${{ steps.versioning.outputs.release_version }}" `
                -AppcastUrl $appcastUrl
              Copy-Item linux-distribution/*.tar.gz release-assets/
              Copy-Item linux-distribution/*.deb release-assets/
            }
            "osx-arm64" {
              ./scripts/release/Package-AvaloniaMacOS.ps1 `
                -PublishDirectory release-publish `
                -OutputDirectory macos-distribution `
                -ReleaseVersion "${{ steps.versioning.outputs.release_version }}" `
                -SigningIdentity $env:MACOS_SIGNING_IDENTITY `
                -NotaryKeyPath $env:MACOS_NOTARY_KEY_PATH `
                -NotaryKeyId $env:MACOS_NOTARY_KEY_ID `
                -NotaryIssuerId $env:MACOS_NOTARY_ISSUER_ID
              Copy-Item macos-distribution/*.dmg release-assets/
            }
            default { throw "Unsupported release target." }
          }

      - name: Validate retained release artifact
        shell: pwsh
        run: |
          $packageRoot = if ("${{ matrix.rid }}" -eq "osx-arm64") {
            "macos-distribution"
          }
          else {
            "release-publish"
          }
          ./scripts/validation/Test-NativePackageDependencies.ps1 `
            -PackageDirectory $packageRoot `
            -RuntimeIdentifier "${{ matrix.rid }}"
          if (Test-Path -LiteralPath release-fast) {
            ./scripts/validation/Test-NativePackageDependencies.ps1 `
              -PackageDirectory release-fast `
              -RuntimeIdentifier "${{ matrix.rid }}"
          }

      - name: Upload retained native release artifact
        uses: actions/upload-artifact@v6
        with:
          name: avalonia-release-${{ matrix.rid }}-${{ github.sha }}
          path: release-assets/*
          retention-days: 7
          if-no-files-found: error

  package-microsoft-store-msix:
    name: Package Microsoft Store MSIX
    needs: [package-avalonia-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute Store release metadata
        id: versioning
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $storeVersion = ./scripts/release/Get-MicrosoftStoreVersion.ps1 -ReleaseTag $tag
          $releaseVersion = $tag.Substring(1)
          "store_version=$storeVersion" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Download validated Windows release payload
        uses: actions/download-artifact@v6
        with:
          name: avalonia-release-win-x64-${{ github.sha }}
          path: windows-release

      - name: Extract self-contained Windows payload
        shell: pwsh
        run: |
          $archive = "windows-release/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "The validated self-contained Windows release archive is missing."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath store-publish

      - name: Build unsigned Partner Center MSIX
        shell: pwsh
        run: |
          ./scripts/release/New-MicrosoftStoreMsix.ps1 `
            -IdentityName 'Legends77.OTPHarbor' `
            -Publisher 'CN=84095A7C-6458-436E-ABF2-DC02311E25F9' `
            -PublisherDisplayName 'Legends77' `
            -Version '${{ steps.versioning.outputs.store_version }}' `
            -PublishDirectory store-publish

      - name: Upload Partner Center submission artifact
        uses: actions/upload-artifact@v6
        with:
          name: otp-harbor-microsoft-store-${{ steps.versioning.outputs.release_version }}
          path: |
            artifacts/store/*.msix
            artifacts/store/SHA256SUMS
            artifacts/store/store-package.json
          if-no-files-found: error
          retention-days: 90

  publish-unsigned-preview:
    name: Publish update-enabled Windows and Linux preview
    needs: [package-avalonia-release, package-microsoft-store-msix]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    env:
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK for signed preview metadata
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download retained preview artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: avalonia-release-*-${{ github.sha }}
          path: preview-assets
          merge-multiple: true

      - name: Validate unsigned preview payload
        id: versioning
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+-rc\d+)$') {
            throw "Unsigned previews require an RC tag."
          }
          $releaseVersion = $Matches.version
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT

          $artifactPaths = @(Get-ChildItem preview-assets -File | Where-Object {
            $_.Name -match '^(OTP-Harbor-(windows-x64(?:-fast)?|linux-x64)-.+\.(zip|msi|tar\.gz)|OTP-Harbor-windows-x64-setup-.+\.exe|otp-harbor_.+_amd64\.deb)$'
          } | Select-Object -ExpandProperty FullName)
          if ($artifactPaths.Count -ne 6) {
            throw "The unsigned preview must contain exactly six Windows/Linux artifacts."
          }
          if (Get-ChildItem preview-assets -File | Where-Object { $_.Name -match '(appcast|macos|\.dmg$)' }) {
            throw "Unsigned previews cannot contain appcasts or macOS artifacts."
          }

          ./scripts/release/New-ReleaseArtifactManifest.ps1 `
            -ReleaseVersion $releaseVersion `
            -SourceCommit "${{ github.sha }}" `
            -ArtifactPath $artifactPaths `
            -OutputPath preview-assets/release-artifacts-v2.json `
            -ReleaseProfile unsigned-platform-preview
          ./scripts/release/Test-ReleaseArtifactManifest.ps1 `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -ArtifactDirectory preview-assets

          $checksumLines = foreach ($path in ($artifactPaths | Sort-Object)) {
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD "preview-assets/SHA256SUMS"),
            (($checksumLines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false))

      - name: Install pinned NetSparkle signing tool
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Generate and verify signed preview feed
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NETSPARKLE_PUBLIC_KEY) -or
              [string]::IsNullOrWhiteSpace($env:NETSPARKLE_PRIVATE_KEY)) {
            throw "Ed25519 release signing credentials are required for preview updates."
          }
          $clientSettings = Get-Content TOTP.UI.Avalonia.Desktop/appsettings.json -Raw | ConvertFrom-Json
          $expectedPublicKey = $clientSettings.AutoUpdate.PublicKey
          if ($expectedPublicKey -cne $env:NETSPARKLE_PUBLIC_KEY.Trim()) {
            throw "The CI public key does not match the key embedded in the Avalonia client."
          }

          $keyDirectory = Join-Path $env:RUNNER_TEMP "netsparkle-keys"
          New-Item -ItemType Directory -Path $keyDirectory | Out-Null
          $publicKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.pub"
          $privateKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.priv"
          [IO.File]::WriteAllText($publicKeyPath, $env:NETSPARKLE_PUBLIC_KEY.Trim(), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($privateKeyPath, $env:NETSPARKLE_PRIVATE_KEY.Trim(), [Text.Encoding]::ASCII)
          & chmod 600 $privateKeyPath

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          ./scripts/release/Generate-AvaloniaAppcast.ps1 `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -ArtifactDirectory preview-assets `
            -BaseDownloadUrl $baseUrl `
            -PrivateKeyPath $privateKeyPath `
            -PublicKeyPath $publicKeyPath `
            -ExpectedPublicKey $expectedPublicKey `
            -OutputDirectory preview-feed
          ./scripts/release/Test-AvaloniaAppcast.ps1 `
            -AppcastPath preview-feed/appcast-v2.xml `
            -ManifestPath preview-assets/release-artifacts-v2.json `
            -BaseDownloadUrl $baseUrl

          $feedSignature = (Get-Content preview-feed/appcast-v2.xml.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify preview-feed/appcast-v2.xml `
            --signature $feedSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Preview appcast signature verification failed." }

          $manifestSignature = (Get-Content preview-assets/release-artifacts-v2.json.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify preview-assets/release-artifacts-v2.json `
            --signature $manifestSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Preview manifest signature verification failed." }

          Copy-Item preview-feed/appcast-v2.xml preview-assets/
          Copy-Item preview-feed/appcast-v2.xml.signature preview-assets/

      - name: Build release change summary
        id: release_notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --exclude-drafts `
            --json tagName,publishedAt `
            --jq ".[] | select(.tagName != `"$currentTag`") | [.publishedAt, .tagName] | @tsv" |
            Sort-Object -Descending |
            Select-Object -First 1 |
            ForEach-Object { ($_ -split "`t", 2)[1] }
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            throw "A previous published release is required to generate the change summary."
          }

          $changes = @(git log "$previousTag..$currentTag" --no-merges --pretty=format:'- %s (`%h`)')
          if ($LASTEXITCODE -ne 0 -or $changes.Count -eq 0) {
            throw "Release '$currentTag' contains no user-visible change summary after '$previousTag'."
          }

          $delimiter = [Guid]::NewGuid().ToString('N')
          "summary<<$delimiter" >> $env:GITHUB_OUTPUT
          $changes >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previousTag...$currentTag" >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Upload unsigned preview to a draft
        uses: softprops/action-gh-release@v3.0.1
        with:
          name: OTP Harbor ${{ steps.versioning.outputs.release_version }} — unsigned preview
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## Changes in this release

            ${{ steps.release_notes.outputs.summary }}

            ## Unsigned development preview

            This prerelease is provided for manual testing because the project does not yet have platform code-signing credentials.

            - The Windows executables are **not Authenticode-signed** and may trigger Microsoft Defender SmartScreen warnings.
            - The frameless setup EXE and standalone MSI are also unsigned. Setup installs for all users with administrator approval, then opens the application as the interactive user. Both require manual installer upgrades; application-owned updates are disabled inside these packages.
            - Direct Windows and portable Linux builds check an Ed25519-signed preview appcast and require explicit confirmation before installation.
            - The first preview download remains outside operating-system publisher trust; verify its checksums before running it.
            - macOS is not included because Developer ID signing and notarization are unavailable.
            - Do not use this preview with a production vault; test with synthetic accounts only.

            Verify the downloaded file against `SHA256SUMS` and the source commit recorded in `release-artifacts-v2.json`.

            ## Code signing policy

            This preview is intentionally unsigned. See the project [code signing policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING_POLICY.md) for the stable-release trust model.
          files: |
            preview-assets/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.zip
            preview-assets/OTP-Harbor-windows-x64-fast-${{ steps.versioning.outputs.release_version }}.zip
            preview-assets/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.msi
            preview-assets/OTP-Harbor-windows-x64-setup-${{ steps.versioning.outputs.release_version }}.exe
            preview-assets/OTP-Harbor-linux-x64-${{ steps.versioning.outputs.release_version }}.tar.gz
            preview-assets/otp-harbor_*_amd64.deb
            preview-assets/release-artifacts-v2.json
            preview-assets/release-artifacts-v2.json.signature
            preview-assets/appcast-v2.xml
            preview-assets/appcast-v2.xml.signature
            preview-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish validated unsigned preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseIds = @(gh api `
            "repos/${{ github.repository }}/releases?per_page=100" `
            --paginate `
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id')
          if ($releaseIds.Count -ne 1) {
            throw "Could not resolve exactly one validated preview draft."
          }
          $releaseId = $releaseIds[0]
          gh api `
            --method PATCH `
            "repos/${{ github.repository }}/releases/$releaseId" `
            -F draft=false `
            -F prerelease=true `
            -f make_latest=false | Out-Null

      - name: Refresh the public RC appcast endpoint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}"

  publish-avalonia-release:
    name: Publish complete signed release
    needs: [package-avalonia-release, package-microsoft-store-msix]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    env:
      NETSPARKLE_PUBLIC_KEY: ${{ secrets.NETSPARKLE_PUBLIC_KEY }}
      NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download all retained release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: '*-release-*${{ github.sha }}'
          path: release-assets
          merge-multiple: true

      - name: Compute and validate aggregate artifact manifest
        id: versioning
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:-rc(?<rc>\d+))?$') {
            throw "Release tag has an unsupported format."
          }
          $baseVersion = $Matches.base
          $rcNumber = $Matches.rc
          $releaseVersion = if ($rcNumber) { "$baseVersion-rc$rcNumber" } else { $baseVersion }
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($rcNumber) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

          $artifactPaths = @(Get-ChildItem release-assets -File | Where-Object {
            $_.Name -match '^(OTP-Harbor-(windows-x64(?:-fast)?|macos-arm64|linux-x64)-.+\.(zip|dmg|tar\.gz)|otp-harbor_.+_amd64\.deb)$'
          } | Select-Object -ExpandProperty FullName)
          if ($artifactPaths.Count -ne 5) {
            throw "The aggregate release must contain exactly five selected artifacts."
          }

          ./scripts/release/New-ReleaseArtifactManifest.ps1 `
            -ReleaseVersion $releaseVersion `
            -SourceCommit "${{ github.sha }}" `
            -ArtifactPath $artifactPaths `
            -OutputPath release-assets/release-artifacts-v2.json
          ./scripts/release/Test-ReleaseArtifactManifest.ps1 `
            -ManifestPath release-assets/release-artifacts-v2.json `
            -ArtifactDirectory release-assets

      - name: Determine whether this stable tag should be latest
        id: latest_release
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          if ($currentTag -match '-rc\d+$') {
            "make_latest=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release candidates are never marked latest."
            exit 0
          }
          if ($currentTag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
            throw "Stable release tag '$currentTag' has an unsupported format."
          }

          $stableTags = foreach ($line in (git ls-remote --tags --refs origin "v*")) {
            $parts = $line -split '\s+'
            if ($parts.Count -ge 2 -and $parts[1] -match '^refs/tags/(?<tag>v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+))$') {
              [PSCustomObject]@{
                Tag = $Matches.tag
                Major = [int]$Matches.major
                Minor = [int]$Matches.minor
                Patch = [int]$Matches.patch
              }
            }
          }
          $highestStableTag = $stableTags |
            Sort-Object Major, Minor, Patch |
            Select-Object -Last 1 -ExpandProperty Tag
          if ([string]::IsNullOrWhiteSpace($highestStableTag)) {
            throw "Could not determine the highest stable release tag."
          }
          $makeLatest = if ($currentTag -eq $highestStableTag) { 'true' } else { 'false' }
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT
          Write-Host "Mark stable release as latest: $makeLatest"

      - name: Install pinned NetSparkle signing tool
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Generate and verify signed Avalonia feed
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NETSPARKLE_PUBLIC_KEY) -or
              [string]::IsNullOrWhiteSpace($env:NETSPARKLE_PRIVATE_KEY)) {
            throw "Ed25519 release signing credentials are required."
          }
          $clientSettings = Get-Content TOTP.UI.Avalonia.Desktop/appsettings.json -Raw | ConvertFrom-Json
          $expectedPublicKey = $clientSettings.AutoUpdate.PublicKey
          if ($expectedPublicKey -cne $env:NETSPARKLE_PUBLIC_KEY.Trim()) {
            throw "The CI public key does not match the key embedded in the Avalonia client."
          }

          $keyDirectory = Join-Path $env:RUNNER_TEMP "netsparkle-keys"
          New-Item -ItemType Directory -Path $keyDirectory | Out-Null
          $publicKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.pub"
          $privateKeyPath = Join-Path $keyDirectory "NetSparkle_Ed25519.priv"
          [IO.File]::WriteAllText($publicKeyPath, $env:NETSPARKLE_PUBLIC_KEY.Trim(), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($privateKeyPath, $env:NETSPARKLE_PRIVATE_KEY.Trim(), [Text.Encoding]::ASCII)
          & chmod 600 $privateKeyPath

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          ./scripts/release/Generate-AvaloniaAppcast.ps1 `
            -ManifestPath release-assets/release-artifacts-v2.json `
            -ArtifactDirectory release-assets `
            -BaseDownloadUrl $baseUrl `
            -PrivateKeyPath $privateKeyPath `
            -PublicKeyPath $publicKeyPath `
            -ExpectedPublicKey $expectedPublicKey `
            -OutputDirectory release-feed
          ./scripts/release/Test-AvaloniaAppcast.ps1 `
            -AppcastPath release-feed/appcast-v2.xml `
            -ManifestPath release-assets/release-artifacts-v2.json `
            -BaseDownloadUrl $baseUrl

          $feedSignature = (Get-Content release-feed/appcast-v2.xml.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify release-feed/appcast-v2.xml `
            --signature $feedSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Avalonia appcast signature verification failed." }

          $manifestSignature = (Get-Content release-assets/release-artifacts-v2.json.signature -Raw).Trim()
          netsparkle-generate-appcast `
            --verify release-assets/release-artifacts-v2.json `
            --signature $manifestSignature `
            --key-path $keyDirectory
          if ($LASTEXITCODE -ne 0) { throw "Artifact manifest signature verification failed." }

          Copy-Item release-feed/appcast-v2.xml release-assets/
          Copy-Item release-feed/appcast-v2.xml.signature release-assets/

      - name: Build release change summary
        id: release_notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --exclude-drafts `
            --json tagName,publishedAt `
            --jq ".[] | select(.tagName != `"$currentTag`") | [.publishedAt, .tagName] | @tsv" |
            Sort-Object -Descending |
            Select-Object -First 1 |
            ForEach-Object { ($_ -split "`t", 2)[1] }
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            throw "A previous published release is required to generate the change summary."
          }

          $changes = @(git log "$previousTag..$currentTag" --no-merges --pretty=format:'- %s (`%h`)')
          if ($LASTEXITCODE -ne 0 -or $changes.Count -eq 0) {
            throw "Release '$currentTag' contains no user-visible change summary after '$previousTag'."
          }

          $delimiter = [Guid]::NewGuid().ToString('N')
          "summary<<$delimiter" >> $env:GITHUB_OUTPUT
          $changes >> $env:GITHUB_OUTPUT
          "" >> $env:GITHUB_OUTPUT
          "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previousTag...$currentTag" >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Upload complete signed release to a draft
        uses: softprops/action-gh-release@v3.0.1
        with:
          draft: true
          prerelease: ${{ steps.versioning.outputs.prerelease }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## Changes in this release

            ${{ steps.release_notes.outputs.summary }}

            ## Code signing policy

            See the project [code signing policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CODE_SIGNING_POLICY.md) and [privacy policy](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/PRIVACY.md). This optional direct-download path publishes Windows artifacts only after the workflow has verified their Authenticode signatures and product metadata.
          files: |
            release-assets/OTP-Harbor-windows-x64-${{ steps.versioning.outputs.release_version }}.zip
            release-assets/OTP-Harbor-windows-x64-fast-${{ steps.versioning.outputs.release_version }}.zip
            release-assets/OTP-Harbor-macos-arm64-${{ steps.versioning.outputs.release_version }}.dmg
            release-assets/OTP-Harbor-linux-x64-${{ steps.versioning.outputs.release_version }}.tar.gz
            release-assets/otp-harbor_*_amd64.deb
            release-assets/release-artifacts-v2.json
            release-assets/release-artifacts-v2.json.signature
            release-assets/appcast-v2.xml
            release-assets/appcast-v2.xml.signature
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish validated draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseIds = @(gh api `
            "repos/${{ github.repository }}/releases?per_page=100" `
            --paginate `
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id')
          if ($releaseIds.Count -ne 1) {
            throw "Could not resolve exactly one validated draft release."
          }
          $releaseId = $releaseIds[0]
          gh api `
            --method PATCH `
            "repos/${{ github.repository }}/releases/$releaseId" `
            -F draft=false `
            -F prerelease=${{ steps.versioning.outputs.prerelease }} `
            -f make_latest=${{ steps.latest_release.outputs.make_latest }} | Out-Null

      - name: Refresh the public RC appcast endpoint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
